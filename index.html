<!doctype html>
<html data-version="0.0.192" data-landing-name="clickbox-simple" data-env="production-archive" js-version="" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
  </style>

  <script>
    // 4 zone IDs per preset. Select with ?zp=1, ?zp=2, or ?zp=3.
    // IMPORTANT: "z" is already used as an ad/redirect parameter; use "zp" only.
    var ZONE_PRESETS = {
      "1": { // Current clickbox-simple zones (default)
        current: 10537803,
        newTab: 10537802,
        reverse: 10537801,
        back: 10537805
      },
      "2": { // Fill with the four zone IDs for preset 2
        current: 12146620,
        newTab: 12146619,
        reverse: 12146618,
        back: 12146622
      },
      "3": { // Fill with the four zone IDs for preset 3
        current: 0,
        newTab: 0,
        reverse: 0,
        back: 0
      }
    };

    var zoneParams = new URLSearchParams(window.location.search);
    var requestedPreset = zoneParams.get("zp");
    var selectedPreset = requestedPreset === null ? "1" : requestedPreset;
    var hasPreset = Object.prototype.hasOwnProperty.call(ZONE_PRESETS, selectedPreset);
    var selectedZones = hasPreset ? ZONE_PRESETS[selectedPreset] : null;
    var zoneFields = ["current", "newTab", "reverse", "back"];
    var presetIsValid = !!selectedZones && zoneFields.every(function (name) {
      return Number.isSafeInteger(selectedZones[name]) && selectedZones[name] > 0;
    });

    // Unknown or unconfigured presets cannot silently redirect through preset #1.
    if (!presetIsValid) {
      console.error("[Zone Presets] Invalid or unconfigured preset:", selectedPreset);
      document.addEventListener("DOMContentLoaded", function () {
        var errorBox = document.createElement("div");
        errorBox.style.cssText = "padding:32px;font:16px Arial,sans-serif;color:#b00020;background:#fff";
        errorBox.textContent = "Configuration error: unknown/unconfigured Zone preset (zp=" + selectedPreset + ").";
        document.body.replaceChildren(errorBox);
      });
    } else {
      console.info("[Zone Presets] Selected:", selectedPreset, selectedZones);
    }

    var Z = presetIsValid ? selectedZones : {
      current: 0, newTab: 0, reverse: 0, back: 0
    };

    var APP_CONFIG = {
      domain: "https://yzwtz.com",

      mainExit_currentTab_zoneId: Z.current,
      mainExit_newTab_zoneId: Z.newTab,
      reverse_zoneId: Z.reverse,
      back_zoneId: Z.back,

      flow: "direct",
      useBack: false,
      useRealCmeta: true,
      useOsVersion: true,

      // One common weighted split across the four zone IDs.
      splitAllZones: true,
      mainExit_currentTab_weight: 30,
      mainExit_newTab_weight: 70,
      reverse_weight: 0,
      back_weight: 0
    };
  </script>

  <script>
    (async function () {
      "use strict";

      // Stop immediately on unknown/unconfigured preset.
      if (!presetIsValid) return;

      const qp = new URLSearchParams(location.search);

      function getParam(name, fallback = "") {
        const v = qp.get(name);
        return v == null ? fallback : v;
      }

      function getTimezone() {
        try {
          if (typeof Intl !== "undefined" && Intl.DateTimeFormat) {
            return Intl.DateTimeFormat().resolvedOptions().timeZone || "";
          }
        } catch (_) {}
        return "";
      }

      function getTimezoneOffset() {
        try {
          return String(new Date().getTimezoneOffset());
        } catch (_) {
          return "";
        }
      }

      async function getOsVersion() {
        if (!APP_CONFIG.useOsVersion) return "";
        try {
          const ua = navigator.userAgentData;
          if (!ua || typeof ua.getHighEntropyValues !== "function") return "";
          const data = await ua.getHighEntropyValues(["platformVersion"]);
          return data.platformVersion || "";
        } catch (_) {
          return "";
        }
      }

      function buildCmeta() {
        const html = document.documentElement;
        const payload = {
          dataVer: html.getAttribute("data-version") || "",
          landingName: html.getAttribute("data-landing-name") || "",
          templateHash: ""
        };
        return btoa(JSON.stringify(payload));
      }

      async function buildAfuUrl(zoneId) {
        const domain = APP_CONFIG.domain.replace(/\/$/, "");

        const varValue = getParam("var_2") || getParam("var") || getParam("z") || "";
        const ymidValue = getParam("var_1") || getParam("ymid") || getParam("var") || "";
        const var3Value = getParam("var_3") || "";
        const rhdValue = getParam("rhd", "1");
        const campaignId = getParam("campaignid") || "";
        const clickId = getParam("s") || "";
        const creativeId = getParam("creative_id") || "";

        const btz = getTimezone();
        const bto = getTimezoneOffset();
        const cmeta = APP_CONFIG.useRealCmeta ? buildCmeta() : "";
        const osVersion = await getOsVersion();

        const parts = [];

        if (varValue) parts.push(["var", varValue]);
        parts.push(["rhd", rhdValue]);
        if (osVersion) parts.push(["os_version", osVersion]);
        if (btz) parts.push(["btz", btz]);
        if (bto) parts.push(["bto", bto]);
        if (cmeta) parts.push(["cmeta", cmeta]);
        if (zoneId) parts.push(["zoneid", String(zoneId)]);
        if (varValue) parts.push(["var_2", varValue]);
        if (ymidValue) parts.push(["ymid", ymidValue]);
        if (var3Value) parts.push(["var_3", var3Value]);
        if (campaignId) parts.push(["campaignid", campaignId]);
        if (clickId) parts.push(["click_id", clickId]);
        if (creativeId) parts.push(["creative_id", creativeId]);

        const query = parts
          .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v))
          .join("&");

        return domain + "/afu.php" + (query ? "?" + query : "");
      }

      function pickZoneFromAll() {
        const pool = [
          {
            name: "mainExit_currentTab",
            zoneId: Number(APP_CONFIG.mainExit_currentTab_zoneId || 0),
            weight: Number(APP_CONFIG.mainExit_currentTab_weight || 0)
          },
          {
            name: "mainExit_newTab",
            zoneId: Number(APP_CONFIG.mainExit_newTab_zoneId || 0),
            weight: Number(APP_CONFIG.mainExit_newTab_weight || 0)
          },
          {
            name: "reverse",
            zoneId: Number(APP_CONFIG.reverse_zoneId || 0),
            weight: Number(APP_CONFIG.reverse_weight || 0)
          },
          {
            name: "back",
            zoneId: Number(APP_CONFIG.back_zoneId || 0),
            weight: Number(APP_CONFIG.back_weight || 0)
          }
        ].filter(item => item.zoneId > 0 && item.weight > 0);

        if (!pool.length) return 0;

        const total = pool.reduce((sum, item) => sum + item.weight, 0);
        if (total <= 0) return pool[0].zoneId;

        let roll = Math.random() * total;

        for (const item of pool) {
          if (roll < item.weight) {
            return item.zoneId;
          }
          roll -= item.weight;
        }

        return pool[pool.length - 1].zoneId;
      }

      function pickSingleFallbackZone() {
        return Number(APP_CONFIG.mainExit_currentTab_zoneId || 0);
      }

      const selectedZone = APP_CONFIG.splitAllZones
        ? pickZoneFromAll()
        : pickSingleFallbackZone();

      if (!selectedZone) return;

      const finalUrl = await buildAfuUrl(selectedZone);

      window.location.href = finalUrl;
    })();
  </script>
</head>
<body></body>
</html>
